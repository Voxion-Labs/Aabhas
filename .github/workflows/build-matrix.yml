name: Aabhas Core Matrix CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout The Matrix
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build C++ data plane
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_EXTENSIONS=OFF
          cmake --build build --parallel
          test -f build/libaabhas_data_plane.a
        working-directory: core-engine

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Security Check - Audit Rust Dependencies
        run: cargo audit
        working-directory: core-engine/rust_trap
        continue-on-error: true # Let it warn, but not block initially

      - name: Build Core Data-Plane (Rust/C++)
        run: cargo build --verbose
        working-directory: core-engine/rust_trap

      - name: Verify native library artifact
        run: test -f target/debug/libaabhas.so
        working-directory: core-engine/rust_trap

      - name: Build Control-Plane (Go)
        run: go build -v ./...
        working-directory: control-plane
