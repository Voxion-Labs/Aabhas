name: Aabhas Core Matrix CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        run: |
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git fetch --depth 1 origin "${{ github.ref }}"
          git checkout --detach FETCH_HEAD

      - name: Install Rust Toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build C++ data plane
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_EXTENSIONS=OFF -DAABHAS_BUILD_TESTS=ON
          cmake --build build --parallel
          test -f build/libaabhas_data_plane.a
          ctest --test-dir build --output-on-failure
        working-directory: core-engine

      - name: Setup Go Environment
        run: |
          if ! command -v go >/dev/null 2>&1; then
            if [ -d "/opt/hostedtoolcache/go" ]; then
              CACHED_GO=$(find /opt/hostedtoolcache/go -type f -name go | head -n 1)
              if [ -n "$CACHED_GO" ]; then
                echo "$(dirname "$CACHED_GO")" >> $GITHUB_PATH
              fi
            fi
          fi
          if ! command -v go >/dev/null 2>&1; then
            curl -fsSL https://go.dev/dl/go1.22.8.linux-amd64.tar.gz | sudo tar -C /usr/local -xz
            echo "/usr/local/go/bin" >> $GITHUB_PATH
          fi

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Security Check - Audit Rust Dependencies
        run: cargo audit
        working-directory: core-engine/rust_trap
        continue-on-error: true # Let it warn, but not block initially

      - name: Build Core Data-Plane (Rust/C++)
        run: cargo build --verbose
        working-directory: core-engine/rust_trap

      - name: Test Rust safety grid
        run: cargo test --verbose
        working-directory: core-engine/rust_trap

      - name: Verify native library artifact
        run: test -f target/debug/libaabhas.so
        working-directory: core-engine/rust_trap

      - name: Build Control-Plane (Go)
        run: go build -v ./...
        working-directory: control-plane

      - name: Test Control-Plane (Go)
        run: go test -race -count=1 ./...
        working-directory: control-plane
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/core-engine/rust_trap/target/debug

      - name: Vet Control-Plane (Go)
        run: go vet ./...
        working-directory: control-plane

      - name: Validate shell scripts
        run: |
          bash -n scripts/*.sh
          bash -n tests/e2e_tests/run_tests.sh
          bash -n tests/security_audits/run_valgrind.sh
          bash -n sandbox/vm-scripts/setup_vm.sh
