name: Aabhas Core Matrix CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout The Matrix
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build C++ data plane
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_EXTENSIONS=OFF -DAABHAS_BUILD_TESTS=ON
          cmake --build build --parallel
          test -f build/libaabhas_data_plane.a
          ctest --test-dir build --output-on-failure
        working-directory: core-engine

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Security Check - Audit Rust Dependencies
        run: cargo audit
        working-directory: core-engine/rust_trap
        continue-on-error: true # Let it warn, but not block initially

      - name: Build Core Data-Plane (Rust/C++)
        run: cargo build --verbose
        working-directory: core-engine/rust_trap

      - name: Test Rust safety grid
        run: cargo test --verbose
        working-directory: core-engine/rust_trap

      - name: Verify native library artifact
        run: test -f target/debug/libaabhas.so
        working-directory: core-engine/rust_trap

      - name: Build Control-Plane (Go)
        run: go build -v ./...
        working-directory: control-plane

      - name: Test Control-Plane (Go)
        run: go test -race -count=1 ./...
        working-directory: control-plane

      - name: Vet Control-Plane (Go)
        run: go vet ./...
        working-directory: control-plane

      - name: Validate shell scripts
        run: |
          bash -n scripts/*.sh
          bash -n tests/e2e_tests/run_tests.sh
          bash -n tests/security_audits/run_valgrind.sh
          bash -n sandbox/vm-scripts/setup_vm.sh
